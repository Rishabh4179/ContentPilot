name: Keep Supabase Active

on:
  schedule:
    # Runs every 3 days at 06:00 UTC (keeps the Supabase project active)
    - cron: '0 6 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          RAW_URL: ${{ secrets.SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # 1. Resolve key (prefer service key, fallback to anon key)
          KEY="${SERVICE_KEY:-$ANON_KEY}"
          # Strip any accidental quotes or whitespace
          KEY=$(echo "$KEY" | tr -d '\r\n\"'\'' ' | xargs)

          # 2. Clean and format the URL
          URL=$(echo "$RAW_URL" | tr -d '\r\n\"'\'' ' | xargs)
          
          if [ -z "$URL" ]; then
            echo "❌ Error: SUPABASE_URL secret is empty. Please set it in GitHub Repo Settings -> Secrets -> Actions."
            exit 1
          fi

          if [ -z "$KEY" ]; then
            echo "❌ Error: Neither SUPABASE_SERVICE_KEY nor SUPABASE_ANON_KEY secret was found."
            exit 1
          fi

          # Ensure URL starts with https://
          if [[ "$URL" != http://* ]] && [[ "$URL" != https://* ]]; then
            URL="https://$URL"
          fi
          # Strip trailing slash
          URL="${URL%/}"
          
          TARGET_ENDPOINT="$URL/rest/v1/"
          echo "🌐 Pinging Supabase at: $TARGET_ENDPOINT"

          # 3. Make the keep-alive request
          HTTP_STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            "$TARGET_ENDPOINT")

          echo "📡 HTTP Response Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ Successfully pinged Supabase ($HTTP_STATUS). Project activity recorded!"
          else
            echo "❌ Ping failed with HTTP status: $HTTP_STATUS"
            exit 1
          fi
