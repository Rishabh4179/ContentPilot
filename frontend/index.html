<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Generate SEO-friendly blog articles from a topic and a few keywords, powered by Google Gemini." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%E2%9C%8D%EF%B8%8F</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>ContentPilot</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash of the default.
      (function () {
        try {
          var t = localStorage.getItem("contentpilot-theme");
          var valid = ["midnight","ocean","forest","sunset","rose","nord","mono","light"];
          var theme = valid.indexOf(t) !== -1 ? t : "midnight";
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme === "light" ? "light" : "dark";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
