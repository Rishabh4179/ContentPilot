    <g transform="translate(24, 75)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="210" height="34" rx="17" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-width="1" />
      <text x="14" y="22" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">🥇 ai in cartography</text>
      <rect x="165" y="6" width="30" height="22" rx="11" fill="#6366f1" />
      <text x="175" y="21" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">12</text>

      <!-- Tag 2 -->
      <rect x="225" y="0" width="230" height="34" rx="17" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1" />
      <text x="239" y="22" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">🥈 vector tile optimization</text>
      <rect x="415" y="6" width="26" height="22" rx="11" fill="#8b5cf6" />
      <text x="424" y="21" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">8</text>

      <!-- Tag 3 -->
      <rect x="470" y="0" width="200" height="34" rx="17" fill="#ec4899" fill-opacity="0.2" stroke="#ec4899" stroke-width="1" />
      <text x="484" y="22" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">🥉 equal earth projection</text>
      <rect x="635" y="6" width="24" height="22" rx="11" fill="#ec4899" />
      <text x="643" y="21" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">6</text>

      <!-- Tag 4 -->
      <rect x="685" y="0" width="180" height="34" rx="17" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="700" y="22" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">webgis architecture</text>
      <rect x="830" y="6" width="22" height="22" rx="11" fill="#334155" />
      <text x="837" y="21" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">4</text>

      <!-- Tag 5 -->
      <rect x="880" y="0" width="165" height="34" rx="17" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="895" y="22" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">geospatial api</text>
      <rect x="1010" y="6" width="22" height="22" rx="11" fill="#334155" />
      <text x="1017" y="21" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">3</text>
    </g>
  </g>
</svg>
