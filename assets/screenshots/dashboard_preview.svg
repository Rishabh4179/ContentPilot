<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%">
  <defs>
    <linearGradient id="dbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="goldRank" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>

  <rect width="1200" height="620" fill="url(#dbBg)" />

  <!-- Dashboard Header -->
  <g transform="translate(60, 40)">
    <text x="0" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">📊 Dashboard &amp; Library Intelligence</text>
    <text x="0" y="48" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">Insights and analytics across your entire generated library</text>
  </g>

  <!-- Metric Stat Cards Row -->
  <g transform="translate(60, 110)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="250" height="90" rx="12" fill="#1e293b" stroke="#334155" />
    <text x="20" y="34" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">TOTAL ARTICLES</text>
    <text x="20" y="68" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">42</text>
    <text x="65" y="68" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">▲ +8 this week</text>

    <!-- Card 2 -->
    <rect x="276" y="0" width="250" height="90" rx="12" fill="#1e293b" stroke="#334155" />
    <text x="296" y="34" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">TOTAL WORDS WRITTEN</text>
    <text x="296" y="68" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">54,820</text>

    <!-- Card 3 -->
    <rect x="552" y="0" width="250" height="90" rx="12" fill="#1e293b" stroke="#334155" />
    <text x="572" y="34" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">READING TIME</text>
    <text x="572" y="68" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">274 min</text>

    <!-- Card 4 -->
    <rect x="828" y="0" width="250" height="90" rx="12" fill="#1e293b" stroke="#334155" />
    <text x="848" y="34" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">TOP AUDIENCE</text>
    <text x="848" y="68" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">Engineers</text>
  </g>

  <!-- 3-Column Content Distribution Grid -->
  <g transform="translate(60, 225)">
