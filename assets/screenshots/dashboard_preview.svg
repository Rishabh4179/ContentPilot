    <text x="387" y="34" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">🎭 Writing Tones</text>
    
    <text x="387" y="68" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Professional</text>
    <rect x="387" y="76" width="230" height="8" rx="4" fill="#0f172a" />
    <rect x="387" y="76" width="180" height="8" rx="4" fill="#ec4899" />
    <text x="627" y="84" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">20 (70%)</text>

    <text x="387" y="118" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Conversational</text>
    <rect x="387" y="126" width="230" height="8" rx="4" fill="#0f172a" />
    <rect x="387" y="126" width="80" height="8" rx="4" fill="#f59e0b" />
    <text x="627" y="134" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">8 (30%)</text>

    <!-- Column 3: Lengths -->
    <rect x="734" y="0" width="345" height="175" rx="14" fill="#1e293b" stroke="#334155" />
    <text x="754" y="34" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">📏 Article Lengths</text>
    
    <text x="754" y="68" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Medium (~800–1000 words)</text>
    <rect x="754" y="76" width="230" height="8" rx="4" fill="#0f172a" />
    <rect x="754" y="76" width="160" height="8" rx="4" fill="#06b6d4" />
    <text x="994" y="84" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">22 (68%)</text>

    <text x="754" y="118" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Long (~1500+ words)</text>
    <rect x="754" y="126" width="230" height="8" rx="4" fill="#0f172a" />
    <rect x="754" y="126" width="90" height="8" rx="4" fill="#a855f7" />
    <text x="994" y="134" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">10 (32%)</text>
  </g>

  <!-- Keyword Intelligence Panel -->
  <g transform="translate(60, 420)">
    <rect x="0" y="0" width="1078" height="165" rx="14" fill="#1e293b" stroke="#334155" />
    <text x="24" y="34" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">🏷️ Keyword Intelligence &amp; Search Trends</text>
    <text x="24" y="54" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Live tracked search concepts discovered across generated articles</text>

