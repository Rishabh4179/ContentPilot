    <rect x="0" y="0" width="345" height="175" rx="14" fill="#1e293b" stroke="#334155" />
    <text x="20" y="34" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">🎯 Target Audiences</text>
    
    <text x="20" y="68" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Software Engineers</text>
    <rect x="20" y="76" width="230" height="8" rx="4" fill="#0f172a" />
    <rect x="20" y="76" width="170" height="8" rx="4" fill="url(#accentBar)" />
    <text x="260" y="84" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">18 (65%)</text>

    <text x="20" y="118" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Product Managers</text>
    <rect x="20" y="126" width="230" height="8" rx="4" fill="#0f172a" />
    <rect x="20" y="126" width="90" height="8" rx="4" fill="#10b981" />
    <text x="260" y="134" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">9 (35%)</text>

